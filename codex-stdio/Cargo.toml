[package]
name = "codex-stdio"
version = "0.1.0"
edition = "2021"
description = "Stdio MCP server proxying OpenAI's Chat Completions / Codex API as a worker backend for MCP clients (e.g. Claude Code). Emits newline-delimited JSON-RPC 2.0 over stdio per the MCP transport convention."
publish = false
license = "Apache-2.0"

[[bin]]
name = "codex-stdio"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "~4.6", features = ["derive"] }
log = "0.4"

[dev-dependencies]
tempfile = "~3.27"
