[package]
name = "lsp-rust"
version = "0.1.0"
edition = "2021"
description = "Long-lived LSP shim around rust-analyzer. Exposes definition/references/hover/workspace_symbols/diagnostics/wait-for-indexing over both a CLI and an MCP stdio server. Replaces zeenix/rust-analyzer-mcp v0.2.0 (5 confirmed bugs, see README)."
publish = false
license = "Apache-2.0"

[[bin]]
name = "lsp-rust"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "~4.6", features = ["derive"] }
lsp-shim-core = { path = "../lsp-shim-core" }

[dev-dependencies]
tempfile = "~3.27"
